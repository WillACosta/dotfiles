# ==============================================================================
# General Settings
# ==============================================================================

# Set default terminal mode to 256-color and enable true color support
set-option -g default-terminal "screen-256color"
set-option -as terminal-overrides ',xterm-256color:Tc'

# Enable mouse support
set-option -g mouse on

# Start windows and panes with 1-based indexing
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Set the history limit so we get lots of scrollback
set-option -g history-limit 50000000

# Use vim key bindings in copy mode
set-window-option -g mode-keys vi

# Runs every time a new panel is created
# set-hook -g after-split-window 'run-shell "tmux send-keys -t #{pane_id} \"conda deactivate && cd ~/workspace && clear\" Enter"'

# ==============================================================================
# Keybindings
# ==============================================================================

# Set prefix to Ctrl+a (like GNU Screen)
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload tmux config with prefix + r
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Window creation
bind-key c new-window

# Switch windows
unbind-key -n S-Left
unbind-key -n S-Right
bind-key Left previous-window
bind-key Right next-window

# Easier pane splitting with v = vertical (side-by-side), h = horizontal (top/bottom)
unbind-key '"'
unbind-key %
bind-key v split-window -h
bind-key h split-window -v

# Switch between panes using Alt + Arrow (without prefix)
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Movement Vim-like
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# Resize panes (default tmux shortcuts: Prefix + Ctrl/Alt + Arrow)
unbind-key -n C-h
unbind-key -n C-j
unbind-key -n C-k
unbind-key -n C-l
unbind-key -
unbind-key +
bind-key -r M-Up resize-pane -U 5
bind-key -r M-Down resize-pane -D 5
bind-key -r M-Left resize-pane -L 5
bind-key -r M-Right resize-pane -R 5

# Make scrolling and selection in copy mode easier
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Prefix + y to clear screen and history buffer
bind-key y \
    send-keys "C-c; clear && tmux clear-history" \;\
    send-keys "Enter" \;\
    display-message 'Screen cleared'

# ==============================================================================
# Rosé Pine Main - Custom Status Bar
# ==============================================================================

# Palette
# Base       #191724
# Surface    #1f1d2e
# Overlay    #26233a
# Muted      #6e6a86
# Subtle     #908caa
# Text       #e0def4
# Iris       #c4a7e7
# Foam       #9ccfd8
# Gold       #f6c177

# General
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=default,fg=#e0def4'

# Session
set -g status-left-length 60
set -g status-left '#[fg=#c4a7e7,bold] #[fg=#e0def4]#S #[fg=#6e6a86] '

# No right-side modules
set -g status-right ''

# Windows
set -g window-status-separator '#[fg=#6e6a86] • '

# Inactive windows
set -g window-status-style 'fg=#908caa,bg=default'
set -g window-status-format '#I:#W'

# Active window
set -g window-status-current-style 'fg=#e0def4,bg=default,bold'
set -g window-status-current-format '#I:#W*'

# Activity indicator
set -g window-status-activity-style 'fg=#f6c177,bg=default'

# Pane borders
set -g pane-border-style 'fg=#403d52'
set -g pane-active-border-style 'fg=#c4a7e7'

# Copy mode / selection
set -g mode-style 'fg=#191724,bg=#c4a7e7'

# Command and status messages
set -g message-style 'fg=#e0def4,bg=#26233a'
set -g message-command-style 'fg=#191724,bg=#f6c177'

